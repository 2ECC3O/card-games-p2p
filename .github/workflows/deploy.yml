# Test, build and publish every game to GitHub Pages on every push to main (or by hand from the Actions tab).
# The site: index.html (the game picker) at the root, each game in its own folder.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push waits for the running one.
concurrency:
  group: pages

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # One install for every game (npm workspaces), then every game's tests and build.
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Optional relay (see shared/iceServers.ts). Unset = direct connections only.
          VITE_OPENRELAY_APP: ${{ vars.OPENRELAY_APP }}
          VITE_OPENRELAY_API_KEY: ${{ secrets.OPENRELAY_API_KEY }}

      # Every game's build lands in a folder named after it.
      - run: |
          mkdir site
          cp index.html site/
          for game in poker blackjack roulette pool pokdeng slave; do cp -r "$game/dist" "site/$game"; done

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
